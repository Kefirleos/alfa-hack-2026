<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-Бизнес — Платежи</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark"></span>
        <span>Альфа-Бизнес</span>
      </a>
      <nav>
        <ul class="nav">
          <li><a href="index.html">Главная</a></li>
          <li><a href="insights.html">Инсайты</a></li>
          <li><a href="accounts.html">Счета</a></li>
          <li><a class="active" href="payments.html">Платежи</a></li>
          <li><a href="credits.html">Кредиты</a></li>
          <li><a href="analytics.html">Аналитика</a></li>
          <li><a href="compare.html">Сравнение</a></li>
        </ul>
      </nav>
      <div class="header-side">
        <select id="company-select" title="Компания"></select>
        <span class="meta" id="user-name">Демо-пользователь</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div>
        <h1 class="page-title">Платежи</h1>
        <div class="footer-note">Все операции по счетам компании, свежие сверху</div>
      </div>
      <div class="filter-row">
        <select id="direction-filter">
          <option value="all">Все операции</option>
          <option value="incoming">Только поступления</option>
          <option value="outgoing">Только списания</option>
        </select>
        <select id="category-filter">
          <option value="all">Все категории</option>
        </select>
      </div>
    </div>

    <section class="stat-grid" id="payments-stats">
      <!-- заполняется JS -->
    </section>

    <div class="card" style="margin-top: 24px;">
      <div class="card-header">
        <div class="card-title">Операции <span class="footer-note" id="payments-count"></span></div>
      </div>
      <div class="card-body" id="payments-list">
        <!-- заполняется JS -->
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
