<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-Бизнес — Бизнес-инсайты</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark"></span>
        <span>Альфа-Бизнес</span>
      </a>
      <nav>
        <ul class="nav">
          <li><a href="index.html">Главная</a></li>
          <li><a class="active" href="insights.html">Инсайты</a></li>
          <li><a href="accounts.html">Счета</a></li>
          <li><a href="payments.html">Платежи</a></li>
          <li><a href="credits.html">Кредиты</a></li>
          <li><a href="analytics.html">Аналитика</a></li>

        </ul>
      </nav>

        <select id="company-select" title="Компания"></select>
        <span class="meta" id="user-name">Демо-пользователь</span>
      </div>
    </div>

  <main class="container">

      <div>

        <span class="select-label">Сортировка</span>

          <option value="relevance">По релевантности</option>
          <option value="date">По дате</option>
