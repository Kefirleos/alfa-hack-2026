server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # без кодировки браузер портит русский текст
    charset utf-8;
    charset_types text/html text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
