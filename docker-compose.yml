# Запуск: скопируйте .env.example в .env, впишите LLM_API_KEY и выполните `docker compose up --build`
# Сайт: http://localhost:5173, API и Swagger: http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
      OFFLINE_MODE: ${OFFLINE_MODE:-0}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-google/gemma-4-26b-a4b-it}
      LLM_MODEL_WRITER: ${LLM_MODEL_WRITER:-qwen/qwen3.6-35b-a3b}
      LLM_MODEL_CRITIC: ${LLM_MODEL_CRITIC:-z-ai/glm-5.3-flash}
      LLM_MODEL_RESEARCH: ${LLM_MODEL_RESEARCH:-deepseek/deepseek-v4.1-flash}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-moonshotai/kimi-k2.6}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-qwen/qwen3-vl-30b-a3b-instruct}
    volumes:
      - insights:/app/backend/data/insights
      - llm_cache:/app/backend/llm_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  insights:
  llm_cache:
